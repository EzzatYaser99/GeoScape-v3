<article class="service-details-card">
  <div class="service-details-visual">
    <div class="gallery-container">
      <header class="gallery-header">
        <h4 class="gallery-title">
          {{ titleKey | translate }}
        </h4>
      </header>

      <ul
        class="gallery-grid"
        [attr.aria-label]="ariaLabelKey | translate"
      >
        @for (img of galleryImages; track img) {
          <li>
            <div class="gallery-card">
              <p-image
                [preview]="false"
                [src]="getImagePath(img)"
                [alt]="getImageAlt(img)"
                loading="lazy"
              />
            </div>
          </li>
        }
      </ul>
    </div>
  </div>

  @if (showDescription && description) {
    <div class="viewer-body">
      <p class="viewer-desc">
        {{ description }}
      </p>
    </div>
  }
</article>
