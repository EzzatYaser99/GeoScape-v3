<article class="service-details-card">
  <div class="service-details-visual">
    <div class="gallery-container">
      <header class="gallery-header">
        <h4 class="gallery-title">
          {{ 'services_details.service_gallery' | translate }}
        </h4>
      </header>

      <ul
        class="gallery-grid"
        [attr.aria-label]="
          'services_details.image_gallery' | translate
        "
      >
        @for (img of data.subImages; track img) {
          <li>
            <div class="gallery-card">
              <p-image
                [preview]="false"
                [src]="imagePath + img?.imageSrc"
                [alt]="
                  img.alt || (lang == 'en' ? img.nameEN : img.nameAR)
                "
                loading="lazy"
              />
            </div>
          </li>
        }
      </ul>
    </div>
  </div>

  <div class="viewer-body">
    <p class="viewer-desc">
      {{
        lang == 'en'
          ? data.descriptionEN
          : data.descriptionAR
      }}
    </p>
  </div>
</article>
