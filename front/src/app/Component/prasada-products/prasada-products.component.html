  <div class="prasada-layout grid w-full">
    <div class="col-12 md:col-3 px-0 md:p-1">
      <app-filter-navigation
        [filterItems]="filterItems"
        [(activeIndex)]="activeIndex"
        (activeIndexChange)="setActiveTab($event)"
        titleKey="generic.please_select_product"
      />
    </div>
    <main class="col-12 md:col-9 px-0 md:p-1">
      <app-gallery-detail
        [data]="getGalleryData()"
        [lang]="lang"
        [imagePath]="
          'assets/images/products-page/prasada-products/' +
          (selectedProduct?.category ?? '') +
          '/'
        "
      />
    </main>
  </div>
